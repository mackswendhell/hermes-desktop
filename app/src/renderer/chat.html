<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- worker-src blob: é só para o worker do pdf.js, que já vem bundlado e vira Blob em runtime -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; media-src 'self' blob: file:; img-src 'self' data: blob:; worker-src blob:; connect-src 'self' blob: http://127.0.0.1:8756 https://api.groq.com" />
  <title>Hermes</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div id="titlebar">
    <span id="title-text">Hermes</span>
    <div id="bar-actions">
      <button id="btn-find" title="Buscar nas mensagens (Cmd+K)">⌕</button>
      <button id="btn-conv-menu" title="Opções da conversa">⋮</button>
    </div>
    <div id="win-buttons">
      <button id="btn-pin" title="Manter por cima das outras janelas">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5.6" y="1.4" width="4.8" height="1.8" rx="0.7" />
          <path d="M6.5 3.2h3l.7 4.3 1.6 1.4v1.1H4.2V8.9l1.6-1.4z" />
          <rect x="7.55" y="10.3" width="0.9" height="4.3" rx="0.45" />
        </svg>
      </button>
      <button id="btn-min" title="Minimizar">&#8211;</button>
      <button id="btn-max" title="Maximizar">&#9633;</button>
      <button id="btn-close" title="Fechar (segue na bandeja)">&#10005;</button>
    </div>
  </div>

  <div id="shell">
    <div id="ctx-menu" class="hidden"></div>

    <main id="main">
      <div id="messages"></div>

      <div id="composer">
        <div id="attach-bar" class="hidden"></div>
        <div id="composer-row">
          <div id="stage" class="state-idle" title="Hermes">
            <div id="char-slot"></div>
          </div>
          <div id="input-wrap">
            <button id="btn-attach" title="Anexar arquivo">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M11.2 7.4 7 11.6a2.1 2.1 0 0 1-3-3l4.8-4.8a1.4 1.4 0 0 1 2 2L6.1 10.5a.7.7 0 0 1-1-1l4.3-4.3"
                  fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <textarea id="input" rows="1" placeholder="Escreva para o Hermes… (Enter envia, Shift+Enter quebra linha)" spellcheck="false"></textarea>
            <button id="btn-send" title="Enviar">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 13V3.6M4.2 7.4 8 3.6l3.8 3.8"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
        <div id="composer-status"></div>
        <input id="attach-input" type="file" multiple class="hidden" />
      </div>
    </main>
  </div>

  <dialog id="find-dlg">
    <input id="find-input" type="search" placeholder="Buscar nas mensagens…" autocomplete="off" spellcheck="false" />
    <div id="find-hits"></div>
  </dialog>

  <div id="drop-veil" class="hidden">solte os arquivos aqui</div>
  <script src="chat.js"></script>
</body>
</html>
